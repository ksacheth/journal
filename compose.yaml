# Static configuration for local development on macOS
# No Docker socket required - uses file provider instead
name: journal-prod

services:
  traefik:
    image: traefik:v3.3.6
    restart: always
    command:
      - "--api.insecure=false"
      - "--ping=true"
      - "--providers.file=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - ./traefik.dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - journal-network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:8.2-alpine
    restart: always
    networks:
      - journal-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - MONGODB_URL=${MONGODB_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3001
      - CORS_ORIGIN=${CORS_ORIGIN}
      - REDIS_URL=redis://redis:6379
      - CACHE_ENABLED=false
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - journal-network
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    networks:
      - journal-network

networks:
  journal-network:
    driver: bridge

volumes:
  redis-data:
